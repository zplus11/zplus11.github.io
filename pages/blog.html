	<body>
		<nav>
			<img class="pfp" onclick="location.href='/'" src="/resources/profiles/Portrait.png" alt="pfp">
			<ul>
				<li><a href="/pages/blog.html">My blog</a></li> 
				<li><a href="/pages/gerf.html">GERF</a></li>
				<li><a href="/pages/mgroups.html">MGroups</a></li> 
				<li><a href="/pages/posts/Wolfram.html">WF Resources</a></li>
			</ul>

		<main>
			<section>
				<p><strong>Here I talk about the things I do or like...</strong></p>
				<p>Back to <a href="/">Home.</a>
			</section>
			<div id="tag-filter">
				<button class="tag-btn" data-tag="all">All</button>
			</div>
			<section id="blogs" class="blogs__list">
			</section>
		</main>

		<script src="/pages/blog.js"></script>

		<script>
			document.addEventListener("DOMContentLoaded", async () => {
				await loadBlogs();

				const tagFilter = document.getElementById("tag-filter");

				const tagCounts = {};
				blogs.forEach(blog => {
					blog.tags.forEach(tag => {
						tagCounts[tag] = (tagCounts[tag] || 0) + 1;
					});
				});

				Object.entries(tagCounts)
					.sort((a, b) => b[1] - a[1])
					.forEach(([tag, count]) => {
						const btn = document.createElement("button");
						btn.className = "tag-btn";
						btn.dataset.tag = tag;
						btn.textContent = `${tag} (${count})`;
						tagFilter.appendChild(btn);
					});

				renderBlogs(filterBlogs());
				tagFilter.querySelector('[data-tag="all"]').classList.add("active");

				tagFilter.addEventListener("click", e => {
					const btn = e.target.closest(".tag-btn");
					if (!btn) return;

					const tag = btn.dataset.tag;

					document.querySelectorAll(".tag-btn")
						.forEach(b => b.classList.remove("active"));
					btn.classList.add("active");

					if (tag === "all") {
						renderBlogs(filterBlogs());
					} else {
						renderBlogs(filterBlogs({ tag }));
					}
				});
			});
		</script>
		<footer>Copyright &copy; 2025&ndash;26, Naman T.</footer>
	</body>
</html>
